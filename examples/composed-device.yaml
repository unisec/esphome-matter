# Composed device topology (no Aggregator / no Bridged Device Basic Info).
#
# All entity endpoints are attached directly to the root node as parts of
# ONE device. Use this when a controller (e.g. eWeLink Cube / NSPanel Pro)
# misbehaves with bridges, or when the product is really a single device
# with a few functions (e.g. a 2-gang wall switch).
#
# Trade-off: some controllers show generic names ("Endpoint 2") because the
# per-endpoint name is only available through the FixedLabel cluster.

substitutions:
  name: matter-2gang
  friendly_name: Matter 2-Gang Switch

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

external_components:
  - source: github://unisec/esphome-matter@main
    components: [matter]

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

network:
  enable_ipv6: true

matter:
  vendor_id: 0xFFF1
  product_id: 0x8003
  setup_code: "20202021"
  discriminator: 3843
  topology: composed
  vendor_name: "Unicontrol"
  product_name: "2-Gang Switch"

output:
  - platform: gpio
    pin: GPIO4
    id: out_1
  - platform: gpio
    pin: GPIO5
    id: out_2

light:
  - platform: binary
    name: "Gang 1"                     # On/Off Light
    output: out_1
  - platform: binary
    name: "Gang 2"
    output: out_2

button:
  - platform: matter
    name: "Open Matter Pairing Window"
    action: open_commissioning_window
