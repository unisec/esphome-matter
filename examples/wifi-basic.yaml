# Minimal Matter-over-Wi-Fi device: one relay, one physical button,
# one door contact and a temperature sensor.
#
# Board: ESP32-C6 DevKitC-1 (any esp-matter supported variant works:
# esp32, esp32s3, esp32c3, esp32c6, esp32h2).

substitutions:
  name: matter-wifi-basic
  friendly_name: Matter Wi-Fi Basic

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source: github://unisec/esphome-matter@main
    components: [matter]
    # Local checkout alternative:
    # - source:
    #     type: local
    #     path: ../components

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password

captive_portal:

# Matter is IPv6-only — this is mandatory.
network:
  enable_ipv6: true

matter:
  vendor_id: 0xFFF1          # Test vendor ID (CSA reserved for development)
  product_id: 0x8000
  setup_code: "20202021"     # 8 digits, avoid reserved values (12345678, 11111111, ...)
  discriminator: 3840        # 0..4095
  vendor_name: "Unicontrol"
  product_name: "Matter Relay"
  node_label: "Living Room Relay"
  hardware_version_string: "rev-a"
  software_version_string: "1.0.0"

# --- Entities: every non-internal entity becomes a Matter endpoint ---------

switch:
  - platform: gpio
    pin: GPIO18
    id: relay
    name: "Relay"                      # → On/Off Plug-in Unit

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO19
      mode: INPUT_PULLUP
      inverted: true
    name: "Door"
    device_class: door                 # → Contact Sensor

  - platform: gpio
    pin:
      number: GPIO9                    # BOOT button on the DevKitC-1
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    id: boot_button
    internal: true                     # internal → NOT exposed to Matter
    on_press:
      - switch.toggle: relay

sensor:
  - platform: internal_temperature
    name: "Chip Temperature"           # unit °C → Temperature Sensor

button:
  # Matter management button: opens a new pairing window (multi-admin).
  # NOT exposed as a Matter endpoint.
  - platform: matter
    name: "Open Matter Pairing Window"
    action: open_commissioning_window
    timeout: 5min

  # Wipes all Matter fabrics and reboots.
  - platform: matter
    name: "Matter Factory Reset"
    action: factory_reset
    entity_category: config
